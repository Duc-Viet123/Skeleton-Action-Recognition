seed: 42
num_worker: 8
work_dir: results/figures/st_gcn
phase: train
print_log: true
save_log: true

feeder: Feeders.feeder_finetune.FeederMultiClass

train_feeder_args:
  data_path: data/finetune/train/train_data.npy
  label_path: data/finetune/train/train_label.npy
  debug: false
  window_size: 64
  p_interval: [0.90, 1.10]
  random_choose: true
  random_shift: true
  random_move: true
  random_rot: true
  random_spatial_flip: true
  random_temporal_flip: true
  temporal_mask: true
  temporal_dropout: 0.05
  normalization: false
  vel: false
  bone: false

val_feeder_args: &val_args
  data_path: data/finetune/val/val_data.npy
  label_path: data/finetune/val/val_label.npy
  debug: false
  window_size: 64
  p_interval: [1.0, 1.0]
  random_choose: false
  random_shift: false
  random_move: false
  random_rot: false
  random_spatial_flip: false
  random_temporal_flip: false
  temporal_mask: false
  temporal_dropout: 0.0
  normalization: false
  vel: false
  bone: false

test_feeder_args:
  <<: *val_args
  data_path: data/finetune/test/test_data.npy
  label_path: data/finetune/test/test_label.npy

model: model.st_gcn.Model
model_args:
  in_channels: 3
  num_class: 3
  graph_args:
    layout: openpose
    strategy: spatial
  edge_importance_weighting: true
  dropout: 0.5


lr: 0.0005
weight_decay: 0.01
batch_size: 32
num_epoch: 150
warmup_epoch: 10
label_smoothing: 0.1
mixup_alpha: 0.0
cutmix_alpha: 0.0
mixup_prob: 0.0
use_amp: true
early_stopping_patience: 30

classes: ["Normal", "Fall", "Fight"]
eval_interval: 1
save_interval: 5
tensorboard_log: true
log_interval: 20
