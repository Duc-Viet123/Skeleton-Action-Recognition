<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Surveillance System</title>
<style>
  :root {
    --bg:      #0d0f14;
    --bg2:     #13161e;
    --bg3:     #1a1e2a;
    --border:  #252a38;
    --accent:  #00d4ff;
    --accent2: #0099bb;
    --red:     #ff3b3b;
    --orange:  #ff9500;
    --green:   #00e676;
    --text:    #e8eaf0;
    --dim:     #6b7280;
    --font:    'Consolas', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* TOP BAR */
  #topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 64px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #topbar h1 { font-size: 20px; color: var(--accent); letter-spacing: .5px; }
  #clock { font-size: 15px; color: var(--dim); }

  /* MAIN LAYOUT */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* VIDEO PANEL */
  #video-panel { flex: 1; display: flex; flex-direction: column; padding: 20px 10px 20px 20px; gap: 14px; min-width: 0; }
  #video-wrap { flex: 1; background: #000; border: 2px solid var(--border); border-radius: 6px; overflow: hidden; position: relative; }
  #video-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
  #idle-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--dim); font-size: 16px; text-align: center; pointer-events: none; }
  #idle-msg span { display: block; font-size: 48px; color: var(--border); margin-bottom: 12px; }

  /* CONTROLS */
  #controls { display: flex; align-items: center; gap: 12px; }
  .btn { font-family: var(--font); font-size: 15px; padding: 10px 22px; border: 1px solid; border-radius: 4px; cursor: pointer; background: transparent; transition: opacity .15s; }
  .btn:hover { opacity: .8; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-blue   { color: var(--accent); border-color: var(--accent); }
  .btn-green  { color: var(--green);  border-color: var(--green); }
  .btn-red    { color: var(--red);    border-color: var(--red); }
  #fps-badge { margin-left: auto; font-size: 15px; font-weight: bold; color: var(--accent); background: var(--bg3); padding: 8px 18px; border-radius: 4px; }

  /* FILE INPUT (hidden) */
  #file-input { display: none; }

  /* RIGHT PANEL */
  #right { width: 420px; flex-shrink: 0; background: var(--bg2); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }

  /* CARDS */
  .card { background: var(--bg3); border-radius: 6px; padding: 18px; }
  .card-title { font-size: 12px; color: var(--dim); letter-spacing: 1.5px; margin-bottom: 14px; text-transform: uppercase; }

  /* DETECTION STATUS */
  #det-label { font-size: 46px; font-weight: bold; text-align: center; padding: 6px 0 4px; }
  #det-conf  { font-size: 14px; color: var(--dim); text-align: center; margin-bottom: 12px; }
  #conf-bar-bg { background: var(--border); border-radius: 4px; height: 8px; }
  #conf-bar    { height: 8px; border-radius: 4px; width: 0%; transition: width .3s, background .3s; }

  /* STATS */
  #stats-row { display: flex; gap: 12px; }
  .stat-box  { flex: 1; background: var(--bg); border-radius: 6px; padding: 14px 8px; text-align: center; }
  .stat-box .s-label { font-size: 12px; letter-spacing: 1.2px; margin-bottom: 8px; text-transform: uppercase; }
  .stat-box .s-val   { font-size: 32px; font-weight: bold; }

  /* LOG */
  #log { flex: 1; min-height: 120px; overflow-y: auto; font-size: 13px; line-height: 2; color: var(--dim); }
  .log-time   { color: var(--dim); }
  .log-fight  { color: var(--red); }
  .log-fall   { color: var(--orange); }
  .log-normal { color: var(--green); }
  .log-info   { color: var(--dim); }

  /* MODEL STATUS */
  #model-badge { font-size: 13px; padding: 4px 12px; border-radius: 4px; display: inline-block; }
  .badge-loading { background: #2a2200; color: var(--orange); }
  .badge-ready   { background: #002a15; color: var(--green); }

  /* ALERT THUMBNAILS */
  #alert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 240px; overflow-y: auto; }
  .alert-thumb { position: relative; display: block; width: 100%; border: 0; background: transparent; border-radius: 4px; overflow: hidden; cursor: pointer; padding: 0; font-family: var(--font); color: inherit; text-align: left; appearance: none; }
  .alert-thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .alert-thumb img { width: 100%; height: 90px; object-fit: cover; display: block; }
  .alert-thumb .thumb-label { position: absolute; bottom: 0; left: 0; right: 0; font-size: 12px; padding: 4px 6px; background: rgba(0,0,0,.7); }
  .thumb-fight { color: var(--red); }
  .thumb-fall  { color: var(--orange); }

  /* ALERT VIEWER */
  #alert-viewer { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 28px; background: rgba(0,0,0,.82); }
  #alert-viewer.open { display: flex; }
  #alert-viewer-panel { width: min(100%, 980px); max-height: 92vh; display: flex; flex-direction: column; gap: 10px; }
  #alert-viewer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--text); }
  #alert-viewer-title { font-size: 15px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #alert-viewer-close { flex: 0 0 auto; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg3); color: var(--text); cursor: pointer; font-size: 16px; line-height: 1; }
  #alert-viewer-close:hover { border-color: var(--accent); color: var(--accent); }
  #alert-viewer-img { max-width: 100%; max-height: calc(92vh - 46px); object-fit: contain; background: #000; border: 1px solid var(--border); border-radius: 6px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div id="topbar">
  <h1>◈&nbsp; AI Action Recogniton </h1>
  <div style="display:flex;align-items:center;gap:14px">
    <span id="model-badge" class="badge-loading"> Loading models…</span>
    <span id="clock"></span>
  </div>
</div>

<div id="main">
  <!-- VIDEO -->
  <div id="video-panel">
    <div id="video-wrap">
      <img id="stream-img" alt="stream"/>
      <div id="idle-msg"><span>◈</span>No source selected</div>
    </div>
    <div id="controls">
      <button class="btn btn-blue"  id="btn-upload"  onclick="triggerUpload()">⏏&nbsp; Load Video</button>
      <button class="btn btn-green" id="btn-webcam"  onclick="startWebcam()">◉&nbsp; Webcam</button>
      <button class="btn btn-red"   id="btn-stop"    onclick="stopPipeline()" disabled>■&nbsp; Stop</button>
      <input  type="file" id="file-input" accept=".mp4,.avi,.mov,.mkv,.wmv,.mpeg" onchange="uploadVideo(this)"/>
      <span id="fps-badge">— FPS</span>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right">

    <!-- Detection -->
    <div class="card">
      <div class="card-title">Detection Status</div>
      <div id="det-label" style="color:var(--dim)">—</div>
      <div id="det-conf">Confidence: —</div>
      <div id="conf-bar-bg"><div id="conf-bar"></div></div>
    </div>

    <!-- Stats -->
    <div class="card">
      <div class="card-title">Session Stats</div>
      <div id="stats-row">
        <div class="stat-box">
          <div class="s-label" style="color:var(--red)">Fight</div>
          <div class="s-val"   style="color:var(--red)" id="cnt-fight">0</div>
        </div>
        <div class="stat-box">
          <div class="s-label" style="color:var(--orange)">Fall</div>
          <div class="s-val"   style="color:var(--orange)" id="cnt-fall">0</div>
        </div>
        <div class="stat-box">
          <div class="s-label" style="color:var(--dim)">Uptime</div>
          <div class="s-val"   style="color:var(--text); font-size:14px" id="uptime">0s</div>
        </div>
      </div>
    </div>

    <!-- Alert thumbnails -->
    <div class="card" style="flex:0 0 auto">
      <div class="card-title">Recent Alerts</div>
      <div id="alert-grid"></div>
    </div>

    <!-- Log -->
    <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="card-title">Event Log</div>
      <div id="log"></div>
    </div>

  </div>
</div>

<div id="alert-viewer" aria-hidden="true">
  <div id="alert-viewer-panel" role="dialog" aria-modal="true" aria-labelledby="alert-viewer-title">
    <div id="alert-viewer-head">
      <div id="alert-viewer-title">Alert preview</div>
      <button id="alert-viewer-close" type="button" aria-label="Close alert preview" onclick="closeAlertViewer()">X</button>
    </div>
    <img id="alert-viewer-img" alt="Alert preview"/>
  </div>
</div>

<script>
const API    = '';          // same origin
let   ws     = null;
let   fpsT   = 0, fpsC = 0, fpsDsp = 0;
let   statusInterval = null;

/* ── CLOCK */
function tickClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('vi-VN', {hour12:false, year:'numeric', month:'2-digit', day:'2-digit'});
  setTimeout(tickClock, 1000);
}
tickClock();

/* ── LOG */
function log(msg, cls='log-info') {
  const el  = document.getElementById('log');
  const ts  = new Date().toLocaleTimeString('vi-VN', {hour12:false});
  el.innerHTML += `<div><span class="log-time">[${ts}]</span> <span class="${cls}">${msg}</span></div>`;
  el.scrollTop  = el.scrollHeight;
}

/* ── WEBSOCKET STREAM */
function connectWS() {
  if (ws) { ws.close(); ws = null; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/stream`);
  ws.binaryType = 'arraybuffer';

  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) {
      // JPEG bytes → hiển thị
      const blob = new Blob([e.data], {type:'image/jpeg'});
      const url  = URL.createObjectURL(blob);
      const img  = document.getElementById('stream-img');
      URL.revokeObjectURL(img.src);
      img.src = url;
      img.style.display = 'block';
      document.getElementById('idle-msg').style.display = 'none';

      // FPS counter
      fpsC++;
      const now = performance.now();
      if (now - fpsT >= 1000) {
        fpsDsp = Math.round(fpsC * 1000 / (now - fpsT));
        fpsT   = now; fpsC = 0;
        document.getElementById('fps-badge').textContent = `${fpsDsp} FPS`;
      }
    } else {
      // JSON metadata
      try {
        const d = JSON.parse(e.data);
        if (d.type === 'meta')  updateDetection(d.label, d.conf);
        if (d.type === 'idle')  showIdle();
      } catch {}
    }
  };

  ws.onclose = () => { setTimeout(connectWS, 2000); }; // auto-reconnect
  ws.onerror = () => ws.close();
}

function showIdle() {
  const img = document.getElementById('stream-img');
  img.style.display = 'none';
  document.getElementById('idle-msg').style.display = '';
}

/* ── DETECTION UI */
function updateDetection(label, conf) {
  const lEl  = document.getElementById('det-label');
  const cEl  = document.getElementById('det-conf');
  const bar  = document.getElementById('conf-bar');
  const pct  = Math.round(conf * 100);
  const colorMap = { Fight: 'var(--red)', Fall: 'var(--orange)', Normal: 'var(--green)' };
  const color    = colorMap[label] || 'var(--dim)';
  lEl.textContent   = label || '—';
  lEl.style.color   = color;
  cEl.textContent   = conf > 0 ? `Confidence: ${pct}%` : 'Confidence: —';
  bar.style.width   = `${pct}%`;
  bar.style.background = color;
}

/* ── STATUS POLLING */
function pollStatus() {
  fetch(`${API}/api/status`)
    .then(r => r.json())
    .then(d => {
      // model badge
      const badge = document.getElementById('model-badge');
      if (d.models_ready) {
        badge.textContent  = '✓ Models ready';
        badge.className    = 'badge-ready';
      }

      // counters
      document.getElementById('cnt-fight').textContent = d.alerts.Fight ?? 0;
      document.getElementById('cnt-fall').textContent  = d.alerts.Fall  ?? 0;

      // uptime
      const u = d.uptime_sec || 0;
      document.getElementById('uptime').textContent = u >= 60 ? `${Math.floor(u/60)}m${u%60}s` : `${u}s`;
    })
    .catch(() => {});
}

/* ── ALERT THUMBNAILS */
function alertImageUrl(file) {
  return `/alerts/${encodeURIComponent(file)}`;
}

function openAlertViewer(alertItem) {
  const viewer = document.getElementById('alert-viewer');
  const img = document.getElementById('alert-viewer-img');
  const title = document.getElementById('alert-viewer-title');
  img.src = alertImageUrl(alertItem.file);
  title.textContent = `${alertItem.label} ${alertItem.timestamp} - ${alertItem.file}`;
  viewer.classList.add('open');
  viewer.setAttribute('aria-hidden', 'false');
}

function closeAlertViewer() {
  const viewer = document.getElementById('alert-viewer');
  const img = document.getElementById('alert-viewer-img');
  viewer.classList.remove('open');
  viewer.setAttribute('aria-hidden', 'true');
  img.removeAttribute('src');
}

document.getElementById('alert-viewer').addEventListener('click', (e) => {
  if (e.target.id === 'alert-viewer') closeAlertViewer();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAlertViewer();
});

function refreshAlerts() {
  fetch(`${API}/api/alerts`)
    .then(r => r.json())
    .then(d => {
      const grid = document.getElementById('alert-grid');
      grid.innerHTML = '';
      (d.items || []).slice(0, 8).forEach(a => {
        const cls  = a.label === 'Fight' ? 'thumb-fight' : 'thumb-fall';
        const div  = document.createElement('button');
        div.type = 'button';
        div.className = 'alert-thumb';
        div.title = `Open ${a.label} alert ${a.timestamp}`;
        div.innerHTML = `
          <img src="${alertImageUrl(a.file)}" loading="lazy" onerror="this.style.display='none'"/>
          <div class="thumb-label ${cls}">${a.label} ${a.timestamp}</div>`;
        div.addEventListener('click', () => openAlertViewer(a));
        grid.appendChild(div);
      });
    })
    .catch(() => {});
}

/* ── UPLOAD VIDEO */
function triggerUpload() { document.getElementById('file-input').click(); }

function uploadVideo(input) {
  const file = input.files[0];
  if (!file) return;
  log(`Uploading ${file.name}…`);
  setRunningUI(false); // disable buttons while uploading

  const fd = new FormData();
  fd.append('file', file);
  fetch(`${API}/api/upload-video`, {method:'POST', body:fd})
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        log(`▶ Started → ${d.source}`, 'log-normal');
        setRunningUI(true);
        refreshAlerts();
      } else {
        log(`✗ ${JSON.stringify(d)}`, 'log-fight');
        setRunningUI(false, true);
      }
    })
    .catch(e => { log(`✗ Upload failed: ${e}`, 'log-fight'); setRunningUI(false, true); });
  input.value = '';
}

/* ── WEBCAM */
function startWebcam() {
  log('Starting webcam…');
  fetch(`${API}/api/start-webcam`, {method:'POST'})
    .then(r => r.json())
    .then(d => {
      if (d.ok) { log('◉ Webcam started', 'log-normal'); setRunningUI(true); }
      else       { log(`✗ ${JSON.stringify(d)}`, 'log-fight'); }
    })
    .catch(e => log(`✗ ${e}`, 'log-fight'));
}

/* ── STOP */
function stopPipeline() {
  fetch(`${API}/api/stop`, {method:'POST'})
    .then(() => { log('■ Stopped'); setRunningUI(false, true); showIdle(); })
    .catch(() => {});
}

/* ── UI HELPERS */
function setRunningUI(running, showStop=false) {
  document.getElementById('btn-upload').disabled  =  running;
  document.getElementById('btn-webcam').disabled  =  running;
  document.getElementById('btn-stop').disabled    = !running && !showStop;
  if (!running) {
    document.getElementById('fps-badge').textContent = '— FPS';
    updateDetection('—', 0);
  }
}

/* ── INIT */
connectWS();
setInterval(pollStatus,    2000);
setInterval(refreshAlerts, 5000);
pollStatus();

// Log initial events from server
setInterval(() => {
  fetch(`${API}/api/alerts`)
    .then(r => r.json())
    .then(d => {
      const items = d.items || [];
      if (items.length > 0 && items[0].file !== window._lastAlertId) {
        window._lastAlertId = items[0].file;
        const a = items[0];
        const cls = a.label === 'Fight' ? 'log-fight' : 'log-fall';
        log(`${a.label} detected → ${a.file}`, cls);
      }
    })
    .catch(() => {});
}, 3000);
</script>
</body>
</html>
